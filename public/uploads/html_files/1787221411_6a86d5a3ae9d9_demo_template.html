<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[BRIDE_NAME] &amp; [GROOM_NAME] Wedding</title>
    <style>
        :root {
            --primary: [TITLE_COLOR];
            --secondary: [DETAILS_COLOR];
            --bg-color: #fcf9f6;
            --text-color: #333;
        }
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
        }
        header {
            background-image: url('[BACKGROUND_IMAGE]');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        h2 {
            color: var(--primary);
            font-size: 2.5em;
            margin-top: 50px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Ceremonies Design */
        .ceremony-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .ceremony-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .ceremony-card:hover {
            transform: translateY(-5px);
        }
        .ceremony-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .ceremony-card-content {
            padding: 20px;
        }
        .ceremony-card h3 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 1.5em;
        }
        .ceremony-card p {
            color: var(--secondary);
            font-size: 1.1em;
            margin: 0;
        }

        /* Gallery Design */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Albums Design */
        .albums-flex {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }
        .album-card {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            width: 200px;
        }
        .album-card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
        }
        .album-card h4 {
            margin: 15px 0 5px 0;
            color: var(--secondary);
            font-size: 1.2em;
        }

    </style>
</head>
<body>

    <header>
        <h1>[BRIDE_NAME] &amp; [GROOM_NAME]</h1>
        <p style="font-size: 1.5em;">Are getting married on [WEDDING_DATE] at [WEDDING_TIME]</p>
        <p style="font-size: 1.2em;">[VENUE_NAME]</p>
        <p style="font-size: 1.1em; font-style: italic;">Welcome [GUEST_NAME] ([GUEST_SIDE] - [INVITATION_TYPE])</p>
    </header>

    <div class="container">
        
        <!-- CEREMONIES SECTION (Will be detected by DOM Parser) -->
        <h2>Wedding Events</h2>
        <div class="ceremony-grid">
            <!-- Dummy Card 1 -->
            <!-- CEREMONY_ITEM --><article class="ceremony-card">
                <img src="[CERAMONY_IMAGE]" alt="Haldi Event">
                <div class="ceremony-card-content">
                    <h3>[CERAMONY_NAME]</h3>
                    <p>[CERAMONY_DATE] at [CERAMONY_TIME] - [VENUE_NAME]</p>
                </div>
            </article><!-- /CEREMONY_ITEM -->

            <!-- Dummy Card 2 -->
            

            <!-- Dummy Card 3 -->
            
        </div>

        <!-- ALBUMS SECTION (Will be detected by DOM Parser) -->
        <h2>Our Albums</h2>
        <div class="albums-flex">
            <!-- Dummy Album 1 -->
            <!-- ALBUM_ITEM --><div class="album-card">
                <img src="[ALBUM_IMAGE]" alt="Album 1">
                <h4>[ALBUM_NAME]</h4>
            </div><!-- /ALBUM_ITEM -->

            <!-- Dummy Album 2 -->
            
        </div>

        <!-- GALLERY SECTION (Will be detected by DOM Parser) -->
        <h2>Photo Gallery</h2>
        <div class="gallery-grid">
            <!-- Dummy Gallery Images -->
            <!-- GALLERY_ITEM --><div class="gallery-item"><img src="[GALLERY_IMAGE]" alt="Gallery"></div><!-- /GALLERY_ITEM -->
            
            
            
        </div>

    </div>

</body>
</html>
