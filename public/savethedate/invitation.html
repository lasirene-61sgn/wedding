<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aarav & Ananya - Wedding Invitation</title>
  <!-- Google Fonts for Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --crimson: #c83e5b;
      --crimson-dark: #a62944;
      --pink-bg: #fadadd;
      --pink-border: #f4a6b8;
      --text-white: #ffffff;
      --seal-red: #d91b5c;
      --seal-dark: #8c0c36;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* Mobile Frame Container */
    .invitation-wrapper {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      background: var(--pink-bg);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    /* =========================================
       PAGE 2: INNER INVITATION CARD (UNDERNEATH)
       ========================================= */
    .inner-page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(244, 166, 184, 0.5) 0%, transparent 50%),
        linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #fce4ec 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 22px;
      z-index: 1;
    }

    /* Soft Watercolor Paper Texture Overlay */
    .inner-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(200, 62, 91, 0.06) 1px, transparent 0);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Scalloped Arch Card Container */
    .arch-card-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0.92);
      transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.4s;
    }

    .invitation-wrapper.opened .arch-card-container {
      opacity: 1;
      transform: scale(1);
    }

    .scalloped-svg-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 28px rgba(166, 41, 68, 0.35));
      z-index: 1;
    }

    /* Card Content */
    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-white);
      padding: 40px 25px;
      width: 100%;
    }

    .sparkle-divider {
      width: 90px;
      height: 36px;
      margin: 12px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 0.8s;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      margin-top: 10px;
      margin-bottom: 4px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 0.95s;
    }

    .title-script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.35rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 1.1s;
    }

    /* Monogram AA */
    .monogram-wrapper {
      width: 190px;
      height: 170px;
      margin: 8px 0 22px;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.22));
      opacity: 0;
      transform: scale(0.85);
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 1.25s;
    }

    .couple-names {
      font-family: 'Great Vibes', cursive;
      font-size: 2.45rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 14px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 1.45s;
    }

    /* Reveal Animations when Opened */
    .invitation-wrapper.opened .sparkle-divider,
    .invitation-wrapper.opened .subtitle,
    .invitation-wrapper.opened .title-script,
    .invitation-wrapper.opened .couple-names {
      opacity: 1;
      transform: translateY(0);
    }

    .invitation-wrapper.opened .monogram-wrapper {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================
       FLORAL CORNER DECORATIONS & ANIMATIONS
       ========================================= */
    .floral-cluster {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.5s;
    }

    .floral-top-left {
      top: -15px;
      left: -20px;
      width: 190px;
      height: 220px;
      transform: translate(-30px, -30px) rotate(-10deg);
      opacity: 0;
    }

    .floral-bottom-right {
      bottom: -20px;
      right: -20px;
      width: 210px;
      height: 230px;
      transform: translate(30px, 30px) rotate(10deg);
      opacity: 0;
    }

    .invitation-wrapper.opened .floral-top-left {
      transform: translate(0, 0) rotate(0deg);
      opacity: 1;
      animation: gentleBreezeTL 6s ease-in-out infinite alternate 1.7s;
    }

    .invitation-wrapper.opened .floral-bottom-right {
      transform: translate(0, 0) rotate(0deg);
      opacity: 1;
      animation: gentleBreezeBR 6s ease-in-out infinite alternate 1.7s;
    }

    @keyframes gentleBreezeTL {
      0% { transform: rotate(0deg) translate(0, 0); }
      100% { transform: rotate(3deg) translate(3px, 4px); }
    }

    @keyframes gentleBreezeBR {
      0% { transform: rotate(0deg) translate(0, 0); }
      100% { transform: rotate(-3deg) translate(-3px, -4px); }
    }

    /* =========================================
       PAGE 1: CURTAIN / ENVELOPE COVER OVERLAY
       ========================================= */
    .curtain-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      transition: visibility 0s 1.6s;
    }

    .invitation-wrapper.opened .curtain-overlay {
      pointer-events: none;
      visibility: hidden;
    }

    /* Left & Right White Satin Drapes */
    .drape {
      position: absolute;
      top: 0;
      width: 55%;
      height: 100%;
      background: #f2f2f2;
      transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease 0.2s;
      will-change: transform;
    }

    /* Realistic Satin Fold Gradients */
    .drape-left {
      left: 0;
      background: 
        radial-gradient(ellipse at 100% 35%, rgba(0, 0, 0, 0.12) 0%, transparent 60%),
        linear-gradient(90deg, 
          #dcdcdc 0%, 
          #f5f5f5 18%, 
          #e8e8e8 35%, 
          #ffffff 65%, 
          #dfdfdf 92%, 
          #c8c8c8 100%);
      clip-path: polygon(0 0, 92% 0, 100% 35%, 91% 75%, 98% 100%, 0 100%);
      box-shadow: 8px 0 25px rgba(0, 0, 0, 0.15);
    }

    .drape-right {
      right: 0;
      background: 
        radial-gradient(ellipse at 0% 35%, rgba(0, 0, 0, 0.12) 0%, transparent 60%),
        linear-gradient(-90deg, 
          #dcdcdc 0%, 
          #f5f5f5 18%, 
          #e8e8e8 35%, 
          #ffffff 65%, 
          #dfdfdf 92%, 
          #c8c8c8 100%);
      clip-path: polygon(8% 0, 100% 0, 100% 100%, 2% 100%, 9% 75%, 0% 35%);
      box-shadow: -8px 0 25px rgba(0, 0, 0, 0.18);
    }

    /* Subtle Hourglass Outer Shadow Edge */
    .drape-left::after, .drape-right::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, transparent 30%, rgba(0,0,0,0.06) 100%);
      pointer-events: none;
    }

    /* Center Seam Line */
    .center-seam {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      background: linear-gradient(to bottom, #999 0%, #777 35%, #bbb 75%, #888 100%);
      transform: translateX(-50%);
      z-index: 11;
      transition: opacity 0.5s ease;
    }

    /* Opening Curtain Transforms */
    .invitation-wrapper.opened .drape-left {
      transform: translateX(-105%) rotate(-3deg);
      opacity: 0;
    }

    .invitation-wrapper.opened .drape-right {
      transform: translateX(105%) rotate(3deg);
      opacity: 0;
    }

    .invitation-wrapper.opened .center-seam {
      opacity: 0;
    }

    /* =========================================
       WAX SEAL BUTTON ("TAP TO OPEN")
       ========================================= */
    .wax-seal-btn {
      position: relative;
      z-index: 15;
      width: 195px;
      height: 195px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      transform: translateY(-45px);
      animation: sealPulse 2.4s ease-in-out infinite;
      transition: transform 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.5s ease;
    }

    .wax-seal-btn:hover {
      filter: brightness(1.05);
    }

    .wax-seal-btn:active {
      transform: translateY(-45px) scale(0.93);
    }

    .invitation-wrapper.opened .wax-seal-btn {
      animation: none;
      transform: translateY(-45px) scale(1.35);
      opacity: 0;
    }

    @keyframes sealPulse {
      0%, 100% {
        transform: translateY(-45px) scale(1);
        filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.32));
      }
      50% {
        transform: translateY(-45px) scale(1.04);
        filter: drop-shadow(0 16px 24px rgba(217, 27, 92, 0.45));
      }
    }

    .wax-seal-svg {
      position: absolute;
      width: 100%;
      height: 100%;
       inset: 0;
    }

    .seal-text {
      position: relative;
      z-index: 2;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.22;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 3px rgba(110, 10, 45, 0.7);
      pointer-events: none;
    }

    /* Floating Petals Canvas */
    #petals-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Replay Button for testing */
    .replay-btn {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(200, 62, 91, 0.3);
      color: var(--crimson-dark);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease 2s;
    }

    .invitation-wrapper.opened .replay-btn {
      opacity: 0.85;
      pointer-events: auto;
    }

    .replay-btn:hover {
      opacity: 1;
      background: #fff;
    }

    /* Save The Date Info Card */
    .std-info-card {
      margin-top: 8px;
      text-align: center;
      z-index: 5;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease 1.6s;
    }
    .invitation-wrapper.opened .std-info-card {
      opacity: 1;
      transform: translateY(0);
    }
    .std-date {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      margin-bottom: 2px;
    }
    .std-venue {
      font-size: 0.78rem;
      letter-spacing: 1px;
      color: #fceef2;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .std-msg {
      font-size: 0.72rem;
      font-style: italic;
      color: #fadadd;
      max-width: 270px;
      margin: 0 auto 8px;
    }
    .std-cta-btn {
      display: inline-block;
      background: #ffffff;
      color: var(--crimson-dark);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 6px 16px;
      border-radius: 20px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .std-cta-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <div class="invitation-wrapper" id="invitationWrapper">
    
    <!-- ================================================
         PAGE 1: WHITE DRAPE CURTAINS & WAX SEAL OVERLAY
         ================================================ -->
    <div class="curtain-overlay" id="curtainOverlay">
      <div class="drape drape-left"></div>
      <div class="drape drape-right"></div>
      <div class="center-seam"></div>

      <!-- Wax Seal Button -->
      <button class="wax-seal-btn" id="openSealBtn" aria-label="Tap to Open Invitation">
        <svg class="wax-seal-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 3D Glossy Wax Gradient -->
            <radialGradient id="waxOuterGrad" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ff5c8d" />
              <stop offset="35%" stop-color="#e01e5a" />
              <stop offset="75%" stop-color="#b81246" />
              <stop offset="100%" stop-color="#7a082b" />
            </radialGradient>

            <radialGradient id="waxInnerGrad" cx="65%" cy="70%" r="75%">
              <stop offset="0%" stop-color="#ff7aa2" />
              <stop offset="45%" stop-color="#e62e6b" />
              <stop offset="100%" stop-color="#9e0e3c" />
            </radialGradient>

            <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff9ebb" stop-opacity="0.9"/>
              <stop offset="50%" stop-color="#b81246" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#5e0521" stop-opacity="0.9"/>
            </linearGradient>

            <filter id="innerGrooveShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#4a0218" flood-opacity="0.65"/>
            </filter>
          </defs>

          <!-- Organic Wavy Wax Outer Edge -->
          <path d="M 100,10 
                   C 118,8 128,18 145,18 
                   C 162,18 172,30 176,46 
                   C 180,62 192,76 190,95 
                   C 188,114 194,132 182,148 
                   C 170,164 156,168 142,178 
                   C 128,188 114,192 98,188 
                   C 82,184 66,192 52,180 
                   C 38,168 24,162 18,145 
                   C 12,128 8,112 12,94 
                   C 16,76 10,56 22,40 
                   C 34,24 50,24 65,16 
                   C 80,8 82,12 100,10 Z" 
                fill="url(#waxOuterGrad)" />

          <!-- Outer Molded Ridge -->
          <path d="M 100,18 
                   C 116,16 125,25 140,25 
                   C 155,25 164,35 168,50 
                   C 172,65 182,77 180,94 
                   C 178,111 183,127 173,141 
                   C 163,155 150,159 137,168 
                   C 124,177 112,180 98,177 
                   C 84,174 69,180 57,170 
                   C 45,160 32,154 27,139 
                   C 22,124 18,110 22,94 
                   C 26,78 20,60 31,46 
                   C 42,32 56,32 69,25 
                   C 82,18 84,20 100,18 Z" 
                fill="none" stroke="url(#rimHighlight)" stroke-width="3.5" opacity="0.85" />

          <!-- Deep Engraved Inner Ring -->
          <circle cx="100" cy="100" r="64" fill="url(#waxInnerGrad)" stroke="#7a082b" stroke-width="4" filter="url(#innerGrooveShadow)" />
          
          <!-- Inner Raised Gold/Pink Rim -->
          <circle cx="100" cy="100" r="58" fill="none" stroke="#ff8cb1" stroke-width="1.5" stroke-opacity="0.7" />
          <circle cx="100" cy="100" r="54" fill="none" stroke="#9e0e3c" stroke-width="1" stroke-opacity="0.5" />

          <!-- Glossy Specular Highlight -->
          <ellipse cx="78" cy="65" rx="34" ry="18" transform="rotate(-25 78 65)" fill="rgba(255, 255, 255, 0.16)" />
        </svg>

        <span class="seal-text">TAP<br>TO<br>OPEN</span>
      </button>
    </div>

    <!-- ================================================
         PAGE 2: WEDDING INVITATION CARD
         ================================================ -->
    <div class="inner-page">
      
      <!-- Subtle Falling Petals Canvas -->
      <canvas id="petals-canvas"></canvas>

      <!-- Top-Left Cosmos Floral Arrangement -->
      <svg class="floral-cluster floral-top-left" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="rgba(80, 15, 30, 0.28)" />
          </filter>
          <radialGradient id="whitePetalGrad" cx="50%" cy="80%" r="80%">
            <stop offset="0%" stop-color="#f3e5ab" />
            <stop offset="25%" stop-color="#ffffff" />
            <stop offset="85%" stop-color="#f7f2f4" />
            <stop offset="100%" stop-color="#e6dce0" />
          </radialGradient>
          <radialGradient id="pinkPetalGrad" cx="50%" cy="80%" r="80%">
            <stop offset="0%" stop-color="#b53363" />
            <stop offset="30%" stop-color="#f472a0" />
            <stop offset="85%" stop-color="#ffa6c9" />
            <stop offset="100%" stop-color="#ffd1e3" />
          </radialGradient>
          <radialGradient id="yellowCenter" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ffe63b" />
            <stop offset="65%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#b45309" />
          </radialGradient>
          <!-- Single Cosmos Petal Path -->
          <path id="cosmosPetal" d="M 0,0 C -10,-16 -16,-42 -8,-54 C -4,-58 0,-55 2,-57 C 5,-55 8,-58 11,-53 C 18,-40 10,-16 0,0 Z" />
        </defs>

        <!-- Stems & Wispy Leaves -->
        <g stroke="#4a5d32" stroke-width="1.8" fill="none" stroke-linecap="round">
          <path d="M 10,0 Q 45,35 75,85" />
          <path d="M 40,0 Q 55,20 75,32" />
          <path d="M 55,15 L 68,8 M 50,25 L 35,20" stroke-width="1.2" />
          <path d="M 22,85 Q 15,125 22,165" />
        </g>

        <!-- Unopened Floral Buds -->
        <g transform="translate(75, 32) rotate(35)">
          <circle cx="0" cy="0" r="7" fill="#a83860" />
          <path d="M -6,2 Q 0,-8 6,2 Q 0,8 -6,2 Z" fill="#4a5d32" />
        </g>
        <g transform="translate(22, 165) rotate(-15)">
          <circle cx="0" cy="0" r="6" fill="#c85a82" />
          <path d="M -5,1 Q 0,-7 5,1 Q 0,7 -5,1 Z" fill="#4a5d32" />
        </g>

        <!-- Partial Pink Flower Left Edge -->
        <g transform="translate(-5, 110) scale(0.75)" filter="url(#flowerShadow)">
          <use href="#cosmosPetal" fill="url(#pinkPetalGrad)" transform="rotate(35)" />
          <use href="#cosmosPetal" fill="url(#pinkPetalGrad)" transform="rotate(75)" />
          <use href="#cosmosPetal" fill="url(#pinkPetalGrad)" transform="rotate(115)" />
          <use href="#cosmosPetal" fill="url(#pinkPetalGrad)" transform="rotate(155)" />
        </g>

        <!-- Main White Cosmos Flower -->
        <g transform="translate(82, 92) scale(0.92)" filter="url(#flowerShadow)">
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(0)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(45)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(90)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(135)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(180)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(225)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(270)" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(315)" />
          <!-- Secondary Layer Petals -->
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(22) scale(0.88)" opacity="0.9" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(112) scale(0.88)" opacity="0.9" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(202) scale(0.88)" opacity="0.9" />
          <use href="#cosmosPetal" fill="url(#whitePetalGrad)" transform="rotate(292) scale(0.88)" opacity="0.9" />
          <!-- Golden Pollen Center -->
          <circle cx="0" cy="0" r="13" fill="url(#yellowCenter)" />
          <circle cx="-3" cy="-3" r="9" fill="none" stroke="#fff3b0" stroke-width="1.5" stroke-dasharray="2 3" />
        </g>
      </svg>

      <!-- Scalloped Arch Card -->
      <div class="arch-card-container">
        
        <!-- Scalloped Arch SVG Shape -->
        <svg class="scalloped-svg-bg" viewBox="0 0 360 680" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cardCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#cf4662" />
              <stop offset="50%" stop-color="#c43653" />
              <stop offset="100%" stop-color="#ab2742" />
            </linearGradient>
          </defs>
          <!-- Scalloped Arch Top & Bottom Path -->
          <path d="M 12,135
                   C 12,110 30,95 55,95
                   C 55,65 80,50 112,55
                   C 130,20 155,10 180,10
                   C 205,10 230,20 248,55
                   C 280,50 305,65 305,95
                   C 330,95 348,110 348,135
                   L 348,545
                   C 348,570 330,585 305,585
                   C 305,615 280,630 248,625

  <script>
    const invitationWrapper = document.getElementById('invitationWrapper');
    const openSealBtn = document.getElementById('openSealBtn');
    const replayBtn = document.getElementById('replayBtn');
    const canvas = document.getElementById('petals-canvas');
    const ctx = canvas.getContext('2d');

    let animationFrameId;
    let petals = [];

    // Resize Canvas
    function resizeCanvas() {
      canvas.width = invitationWrapper.clientWidth;
      canvas.height = invitationWrapper.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Floating Petal Particle Class
    class Petal {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : -20;
        this.size = Math.random() * 6 + 4;
        this.speedY = Math.random() * 0.7 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.angle = Math.random() * 360;
        this.spin = (Math.random() - 0.5) * 1.2;
        this.opacity = Math.random() * 0.45 + 0.2;
        this.color = Math.random() > 0.5 ? '#ffffff' : '#ffb6c1';
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.02) * 0.3;
        this.angle += this.spin;

        if (this.y > canvas.height + 20) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.angle * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initPetals() {
      petals = [];
      for (let i = 0; i < 18; i++) {
        petals.push(new Petal());
      }
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      petals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      animationFrameId = requestAnimationFrame(animatePetals);
    }

    // Open Curtain Handler
    openSealBtn.addEventListener('click', () => {
      invitationWrapper.classList.add('opened');
      initPetals();
      cancelAnimationFrame(animationFrameId);
      animatePetals();
    });

    // Replay Button Handler
    replayBtn.addEventListener('click', () => {
      invitationWrapper.classList.remove('opened');
      setTimeout(() => {
        cancelAnimationFrame(animationFrameId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 600);
    });
  </script>
